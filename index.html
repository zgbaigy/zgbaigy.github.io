<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="个人简历网站：展示个人简介、工作经历、项目经历、教育背景、技能证书与联系方式。" />
  <title>个人简历</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 顶部导航 -->
  <header class="site-header">
    <div class="container nav-inner">
      <a href="#overview" class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span id="brandName">个人简历</span>
      </a>

      <nav class="nav-links" aria-label="主导航">
        <a href="#overview" class="active">概览</a>
        <a href="#experience">工作经历</a>
        <a href="#projects">项目经历</a>
        <a href="#education">教育背景</a>
        <a href="#skills">技能证书</a>
        <a href="#contact">联系方式</a>
      </nav>

      <div class="nav-actions">
        <button type="button" class="btn-print-nav" id="printNavBtn" title="打印或另存为 PDF">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect width="12" height="8" x="6" y="14"></rect>
          </svg>
          <span>导出 PDF</span>
        </button>

        <button type="button" class="icon-btn" id="themeToggle" aria-label="切换主题"></button>

        <button type="button" class="icon-btn menu-toggle" id="menuToggle" aria-label="打开菜单" aria-expanded="false" aria-controls="mobileNav">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" x2="20" y1="6" y2="6"></line>
            <line x1="4" x2="20" y1="12" y2="12"></line>
            <line x1="4" x2="20" y1="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 移动端折叠导航 -->
  <nav class="mobile-nav" id="mobileNav" aria-label="移动端导航">
    <a href="#overview">概览</a>
    <a href="#experience">工作经历</a>
    <a href="#projects">项目经历</a>
    <a href="#education">教育背景</a>
    <a href="#skills">技能证书</a>
    <a href="#contact">联系方式</a>
  </nav>

  <main class="container">
    <!-- 1. 首页概览与个人简介 -->
    <section id="overview" class="section hero-section" aria-label="个人简介">
      <div class="card hero-card" id="heroCard"></div>
      <div class="highlights-grid" id="highlightsGrid"></div>
    </section>

    <!-- 2. 工作经历 -->
    <section id="experience" class="section" aria-labelledby="experienceHeading">
      <div class="section-header">
        <div>
          <span class="section-kicker">Experience</span>
          <h2 class="section-title" id="experienceHeading">工作经历</h2>
        </div>
      </div>
      <div class="timeline" id="experienceList"></div>
    </section>

    <!-- 3. 项目经历 -->
    <section id="projects" class="section" aria-labelledby="projectsHeading">
      <div class="section-header">
        <div>
          <span class="section-kicker">Projects</span>
          <h2 class="section-title" id="projectsHeading">项目经历</h2>
        </div>
        <div class="filter-bar" id="projectFilter" role="tablist" aria-label="项目分类筛选"></div>
      </div>
      <div class="projects-grid" id="projectsGrid"></div>
    </section>

    <!-- 4. 教育背景 -->
    <section id="education" class="section" aria-labelledby="educationHeading">
      <div class="section-header">
        <div>
          <span class="section-kicker">Education</span>
          <h2 class="section-title" id="educationHeading">教育背景</h2>
        </div>
      </div>
      <div class="edu-grid" id="educationGrid"></div>
    </section>

    <!-- 5. 技能与证书 -->
    <section id="skills" class="section" aria-labelledby="skillsHeading">
      <div class="section-header">
        <div>
          <span class="section-kicker">Skills &amp; Certifications</span>
          <h2 class="section-title" id="skillsHeading">技能与证书</h2>
        </div>
      </div>
      <div class="skills-layout" id="skillsGrid"></div>

      <h3 class="subsection-title">资格证书与语言能力</h3>
      <div class="cert-grid" id="certGrid"></div>
    </section>

    <!-- 6. 联系方式 -->
    <section id="contact" class="section" aria-labelledby="contactHeading">
      <div class="section-header">
        <div>
          <span class="section-kicker">Contact</span>
          <h2 class="section-title" id="contactHeading">联系方式</h2>
        </div>
      </div>
      <div class="card contact-card" id="contactCard"></div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span id="footerText">© 个人简历</span>
      <a href="#overview" class="back-to-top">
        <span>回到顶部</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m18 15-6-6-6 6"></path>
        </svg>
      </a>
    </div>
  </footer>

  <!-- 复制反馈提示 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 数据配置与渲染脚本（为 data.js 附加时间戳，避免修改后受浏览器 10 分钟缓存影响） -->
  <script>
    (function () {
      var dataScript = document.createElement("script");
      dataScript.src = "./data.js?v=" + Date.now();
      dataScript.onload = function () {
        var appScript = document.createElement("script");
        appScript.src = "./app.js";
        document.body.appendChild(appScript);
      };
      document.body.appendChild(dataScript);
    })();
  </script>
</body>
</html>
